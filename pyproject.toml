[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "disasterlens"
version = "0.1.0"
description = "Synthetic disaster-city benchmark, evaluation tools, and routing application"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pillow>=10.0",
    "numpy>=1.24",
    "shapely>=2.0",
    "pydantic>=2.7,<3",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic-settings>=2.0",
    "sqlalchemy>=2.0",
    "networkx>=3.0",
    "pyyaml>=6.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.5",
]

[project.scripts]
disasterlens-evaluate = "dl.evaluation.run:main"

[tool.setuptools.packages.find]
include = ["dl*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
ignore = [
    "B008",    # FastAPI Depends/Query in function defaults
    "BLE001",  # Broad exception handling in router error converters
    "S110",    # Handled pass in startup lifespan try-except blocks
]
